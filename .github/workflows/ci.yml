name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck hooks
        run: shellcheck --severity=warning .claude/hooks/*.sh

      - name: gate parity check
        run: |
          set -euo pipefail
          # Every gate_protected_areas pattern in project.yml must have
          # matching Edit/Write ask rules in settings.json (native enforcement).
          python3 - <<'PY'
          import json, re, sys

          patterns = []
          in_section = False
          for line in open(".claude/project.yml", encoding="utf-8"):
              if re.match(r"^gate_protected_areas:", line):
                  in_section = True
                  continue
              if in_section and re.match(r"^[A-Za-z]", line):
                  break
              if not in_section or re.match(r"^\s*#", line):
                  continue
              m = re.match(r"""^\s*-\s*pattern:\s*["']?([^"'#]+?)["']?\s*$""", line)
              if m:
                  patterns.append(m.group(1).strip())

          ask = set(json.load(open(".claude/settings.json"))["permissions"]["ask"])
          missing = [p for p in patterns
                     if not any(r.startswith(("Edit(", "Write(")) and p.rstrip("/*") in r for r in ask)]
          if missing:
              sys.exit(f"gate_protected_areas without ask rules in settings.json: {missing}")
          print(f"gate parity OK ({len(patterns)} patterns covered)")
          PY

      - name: session-context smoke test
        env:
          CLAUDE_PROJECT_DIR: ${{ github.workspace }}
        run: |
          set -euo pipefail
          # Idle template state → no injection, exit 0
          out=$(bash .claude/hooks/session-context.sh)
          test -z "$out"
